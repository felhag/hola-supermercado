name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Validate content and precache
      run: npm run validate

    - name: Build
      run: npm run dist

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        folder: _site
