<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hola supermercado</title>
<meta name="description" content="Offline Spanish trainer: flashcards, multiple choice, typing and cloze sentences.">
<meta name="theme-color" content="#1d9e75">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hola supermercado">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <button class="brand" id="btn-home" aria-label="Home">
    <img class="brand-logo" src="./icons/icon-192.png" alt="" width="30" height="30">
    <span class="topbar-title" id="topbar-title">Español</span>
  </button>
  <div class="topbar-right">
    <span class="badge" id="offline-badge" title="Offline readiness">…</span>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">&#9881;</button>
  </div>
</header>

<div id="update-bar" class="update-bar" hidden>
  <span>A new version is cached.</span>
  <button type="button" id="update-reload">Reload</button>
</div>

<main id="view" aria-live="polite">
  <p class="loading">Loading decks…</p>
</main>

<noscript><p class="loading">This app needs JavaScript.</p></noscript>

<script type="module" src="./js/app.js"></script>
</body>
</html>
